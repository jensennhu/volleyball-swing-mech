tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.05        # lowered from 0.1 — recover more lost tracks
new_track_thresh: 0.2         # lowered from 0.25 — match bytetrack behavior
track_buffer: 80              # increased from 50 — occlusion tolerance (~2.7s at 30fps)
match_thresh: 0.6             # lowered from 0.75 — more permissive IOU for fast motion
fuse_score: true

# Camera motion compensation
gmc_method: sparseOptFlow

# Per-frame ReID appearance matching
with_reid: true
proximity_thresh: 0.5
appearance_thresh: 0.25
model: auto                   # uses native detector features (no extra model)
